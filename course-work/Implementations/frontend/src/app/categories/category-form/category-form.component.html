<div class="rf-form-solo">
  <form [formGroup]="form" (ngSubmit)="submit()">
    <div class="rf-section">
      <div class="rf-eyebrow">01 · IDENTITY</div>
      <h2 class="rf-section-title">The basics</h2>
      <hr class="rf-rule" />

      <div class="rf-eyebrow-page">{{ editId ? 'Edit category' : 'New category' }}</div>
      <input class="rf-input-hero" formControlName="name" placeholder="Category name" />
      <div
        *ngIf="form.get('name')?.touched && form.get('name')?.hasError('required')"
        class="rf-error-inline"
      >
        Name required
      </div>

      <div class="rf-field" style="margin-top: 16px">
        <label class="rf-label">DESCRIPTION</label>
        <textarea
          class="rf-textarea"
          formControlName="description"
          rows="3"
          placeholder="What dishes belong here?"
        ></textarea>
      </div>
    </div>

    <div class="rf-section">
      <div class="rf-eyebrow">02 · IMAGE</div>
      <h2 class="rf-section-title">Cover photo</h2>
      <hr class="rf-rule" />

      <div class="rf-upload" (click)="fileInput.click()">
        <img
          *ngIf="previewUrl || form.get('imageUrl')?.value"
          [src]="previewUrl || form.get('imageUrl')?.value"
          class="rf-upload-img"
          alt=""
        />
        <div *ngIf="!previewUrl && !form.get('imageUrl')?.value" class="rf-upload-empty">
          <svg
            width="32"
            height="32"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            viewBox="0 0 24 24"
          >
            <path
              d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5m-13.5-9L12 3m0 0l4.5 4.5M12 3v13.5"
            />
          </svg>
          <span>{{ uploading ? 'Uploading…' : 'Click to upload photo' }}</span>
        </div>
        <input
          #fileInput
          type="file"
          accept="image/*"
          style="display: none"
          (change)="onFileSelected($event)"
        />
      </div>
      <button
        *ngIf="previewUrl || form.get('imageUrl')?.value"
        type="button"
        class="rf-btn-ghost-sm"
        style="margin-top: 8px"
        (click)="clearImage(); $event.stopPropagation()"
      >
        Remove image
      </button>
    </div>

    <div class="rf-actions">
      <p *ngIf="error" class="rf-error">{{ error }}</p>
      <button class="rf-btn-primary" type="submit" [disabled]="form.invalid || uploading">
        {{ uploading ? 'Uploading…' : editId ? 'Save changes' : 'Save category' }}
      </button>
      <a class="rf-btn-ghost" routerLink="/categories">Cancel</a>
    </div>
  </form>
</div>
